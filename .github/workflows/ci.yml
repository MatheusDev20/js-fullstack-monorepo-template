name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest

    services:
      # Mirrors apps/server/docker-compose.yml so the e2e suite can opt into a
      # real database. Exposed on 5432 here — inside the runner nothing else
      # occupies it, unlike the local 5433 default.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm --filter @repo/server run test

      - name: E2E tests
        run: pnpm --filter @repo/server run test:e2e
        env:
          DB_ENABLED: "true"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          DB_SYNC: "true"
          DB_ENTITIES: /dist/**/*.entity.js
